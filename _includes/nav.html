<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
        <line class="bm-line" x1="6" y1="28" x2="28" y2="6"/>
        <rect class="bm-z" x="1" y="23" width="10" height="10"/>
        <circle class="bm-1" cx="17" cy="17" r="5"/>
        <circle class="bm-2" cx="28" cy="6" r="5"/>
      </svg>
      <span class="brand-name">Christian Carrick</span>
    </a>

    <nav class="nav" aria-label="Main">
      <a class="nav-item{% if page.url == '/' %} active{% endif %}" href="/">Research</a>
      {% assign nav_pages = site.pages | where: "layout", "page" | sort: "nav_order" %}
      {% for node in nav_pages %}
        {% if node.title and node.nav_order %}
          <a class="nav-item{% if page.url == node.url %} active{% endif %}" href="{{ node.url }}">{{ node.nav_title | default: node.title }}</a>
        {% endif %}
      {% endfor %}
      <a class="nav-item nav-cv" href="/cv.pdf" target="_blank" rel="noopener">CV</a>
    </nav>
  </div>
</header>
